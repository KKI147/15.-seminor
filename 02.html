<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02 — Pixi 테트리스 (HUD)</title>
    <link rel="stylesheet" href="02.css">
</head>

<body>
    <h1 class="page-title">02 — Pixi 테트리스</h1>
    <p class="page-desc">
        <kbd>←</kbd> <kbd>→</kbd> 이동, <kbd>↑</kbd> 회전, <kbd>↓</kbd> 소프트 드롭, <kbd>Space</kbd> 하드 드롭.
    </p>

    <div class="layout">
        <div id="game" aria-label="게임 보드"></div>
        <aside class="panel" aria-label="점수 패널">
            <h2>상태</h2>
            <dl>
                <dt>점수</dt>
                <dd id="score">0</dd>
                <dt>라인</dt>
                <dd id="lines">0</dd>
                <dt>레벨</dt>
                <dd id="level">1</dd>
            </dl>
            <p id="status">진행 중</p>
        </aside>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.5.2/dist/pixi.min.js"></script>
    <script src="02.js"></script>
</body>

</html>
