<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixiJS Tetris - Week 1</title>
    <link rel="stylesheet" type="text/css" href="common/fonts/fonts.css" />
    <link rel="stylesheet" type="text/css" href="common/css/reset.css" />
    <link rel="stylesheet" type="text/css" href="common/css/animate.css" />
    <link rel="stylesheet" type="text/css" href="common/css/common.css" />
    <link rel="stylesheet" type="text/css" href="common/css/common_sci.css" />
    <link rel="stylesheet" type="text/css" href="common/css/common_repo.css" />

    <style>
        #game-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 4px solid #ecf0f1;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        #ui-layer {
            position: relative;
            top: 10%;
            text-align: center;
        }

        .score-board {
            font-size: 24px;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #e67e22;
            border: none;
            color: white;
            border-radius: 5px;
        }

        button:hover {
            background-color: #d35400;
        }
    </style>
</head>

<body>
    <div id="container"></div>
    <div id="wrap" class="page">
        <div class="contentsWrap">
            <div class="contents clickPage clickPage1">
                <div id="ui-layer">
                    <div class="score-board">Score: <span id="score">0</span></div>
                    <button id="start-btn">Game Start</button>
                </div>

                <div id="game-container"></div>
            </div>
        </div>
    </div>

    <script src="common/js/popscale.js"></script>
    <script src="common/js/jquery-3.6.0.min.js"></script>
    <script src="common/js/jquery.cookie.js"></script>
    <script src="common/js/common.js"></script>
    <script src="common/js/common_sci.js"></script>
    <script src="common/js/common_repo.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>
    <script>
        $(document).ready(function () {
            const COLS = 10;
            const ROWS = 20;
            const BLOCK_SIZE = 30;

            // PixiJS Application 초기화
            const app = new PIXI.Application({
                width: COLS * BLOCK_SIZE,
                height: ROWS * BLOCK_SIZE,
                backgroundColor: 0x000000,
                resolution: window.devicePixelRatio || 1,
            });

            document.getElementById('game-container').appendChild(app.view);

            // 배경 그리드 그리기
            const gridGraphics = new PIXI.Graphics();
            gridGraphics.lineStyle(1, 0x333333, 1);

            for (let i = 0; i <= COLS; i++) {
                gridGraphics.moveTo(i * BLOCK_SIZE, 0);
                gridGraphics.lineTo(i * BLOCK_SIZE, ROWS * BLOCK_SIZE);
            }
            for (let j = 0; j <= ROWS; j++) {
                gridGraphics.moveTo(0, j * BLOCK_SIZE);
                gridGraphics.lineTo(COLS * BLOCK_SIZE, j * BLOCK_SIZE);
            }
            app.stage.addChild(gridGraphics);

            // 게임 시작 버튼 이벤트 (jQuery 사용)
            $('#start-btn').on('click', function () {
                alert('테트리스 게임을 시작합니다!');
                // 여기에 초기화 로직 추가 예정
            });

            console.log('PixiJS 및 jQuery 초기화 완료');
        });
    </script>
</body>

</html>
