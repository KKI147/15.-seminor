<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixiJS Tetris - Week 1</title>
    <link rel="stylesheet" type="text/css" href="common/fonts/fonts.css" />
    <link rel="stylesheet" type="text/css" href="common/css/reset.css" />
    <link rel="stylesheet" type="text/css" href="common/css/animate.css" />
    <link rel="stylesheet" type="text/css" href="common/css/common.css" />
    <link rel="stylesheet" type="text/css" href="common/css/common_sci.css" />
    <link rel="stylesheet" type="text/css" href="common/css/common_repo.css" />
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>

<body>
    <div id="container"></div>
    <div id="wrap" class="page">
        <div class="contentsWrap">
            <div class="contents clickPage clickPage1">
                <div id="ui-layer">
                    <div class="score-board">점수 <span id="score">0</span></div>
                    <div id="status">READY</div>
                    <button type="button" id="start-btn">Game Start</button>
                </div>

                <div id="game-container" aria-label="테트리스 플레이 영역"></div>

                <p class="tetris-hint">
                    <kbd>←</kbd> <kbd>→</kbd> 이동 · <kbd>↓</kbd> 소프트 드롭 · <kbd>↑</kbd> 회전 ·
                    <kbd>Space</kbd> 하드 드롭 · <kbd>Shift</kbd> 또는 <kbd>C</kbd> 홀드
                </p>
            </div>
        </div>
    </div>

    <script src="common/js/popscale.js"></script>
    <script src="common/js/jquery-3.6.0.min.js"></script>
    <script src="common/js/jquery.cookie.js"></script>
    <script src="common/js/common.js"></script>
    <script src="common/js/common_sci.js"></script>
    <script src="common/js/common_repo.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
