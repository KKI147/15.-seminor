<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixiJS Tetris - Week 1</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
        }
        #game-container {
            position: relative;
            border: 4px solid #ecf0f1;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #ui-layer {
            margin-top: 20px;
            text-align: center;
        }
        .score-board {
            font-size: 24px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #e67e22;
            border: none;
            color: white;
            border-radius: 5px;
        }
        button:hover {
            background-color: #d35400;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="score-board">Score: <span id="score">0</span></div>
        <button id="start-btn">Game Start</button>
    </div>
    
    <div id="game-container"></div>

    <script>
        $(document).ready(function() {
            const COLS = 10;
            const ROWS = 20;
            const BLOCK_SIZE = 30;

            // PixiJS Application 초기화
            const app = new PIXI.Application({
                width: COLS * BLOCK_SIZE,
                height: ROWS * BLOCK_SIZE,
                backgroundColor: 0x000000,
                resolution: window.devicePixelRatio || 1,
            });

            document.getElementById('game-container').appendChild(app.view);

            // 배경 그리드 그리기
            const gridGraphics = new PIXI.Graphics();
            gridGraphics.lineStyle(1, 0x333333, 1);
            
            for (let i = 0; i <= COLS; i++) {
                gridGraphics.moveTo(i * BLOCK_SIZE, 0);
                gridGraphics.lineTo(i * BLOCK_SIZE, ROWS * BLOCK_SIZE);
            }
            for (let j = 0; j <= ROWS; j++) {
                gridGraphics.moveTo(0, j * BLOCK_SIZE);
                gridGraphics.lineTo(COLS * BLOCK_SIZE, j * BLOCK_SIZE);
            }
            app.stage.addChild(gridGraphics);

            // 게임 시작 버튼 이벤트 (jQuery 사용)
            $('#start-btn').on('click', function() {
                alert('테트리스 게임을 시작합니다!');
                // 여기에 초기화 로직 추가 예정
            });

            console.log('PixiJS 및 jQuery 초기화 완료');
        });
    </script>
</body>
</html>
